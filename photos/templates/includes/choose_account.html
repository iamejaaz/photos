<style>
	body { background-color: var(--bg-color); }
	.error-page { height: auto; display: block; }
	.error-page > div > .page-card-head { display: none; }
	.error-page .details { max-width: none; margin: 0; padding: 60px 0 0; border: 0; text-align: left; }
	.choose-account { display: flex; flex-direction: column; gap: var(--margin-lg); width: 100%; max-width: 371px; text-align: left; margin: 0 auto; padding: 24px; }
	.choose-account h4 { margin: 0; text-align: left; color: var(--heading-color); font-size: var(--text-2xl); font-weight: var(--weight-bold); }
	.choose-account p { margin: 8px 0 0; color: var(--ink-gray-6); }
	.choose-account .btn { width: 100%; }
	.choose-account .btn-primary { color: white; background: var(--gray-900); border-color: var(--gray-900); }
	.choose-account-actions { display: flex; flex-direction: column; gap: 12px; }
	@media (max-width: 575.98px) {
		.error-page .details { padding: 0; }
		.choose-account { padding: 60px 32px 32px; }
	}
</style>
<section class="choose-account">
	<div>
		<h4>{{ _("Choose an account") }}</h4>
		<p>{{ _("to continue to {0}").format(app_name) }}</p>
	</div>
	<div class="choose-account-actions">
		<a href="{{ continue_url }}" class="btn btn-primary">{{ _("Continue as {0}").format(user) }}</a>
		<form method="POST" action="/api/method/photos.api.native.use_another_account">
			<input type="hidden" name="csrf_token" value="{{ csrf_token }}">
			<input type="hidden" name="query" value="{{ query }}">
			<button type="submit" class="btn btn-default">{{ _("Use another account") }}</button>
		</form>
	</div>
</section>
