<!DOCTYPE html>
<html
  lang="en"
  data-theme-mode="{{ desk_theme.lower() if desk_theme else 'light' }}"
  data-theme="{{ desk_theme.lower() if desk_theme else 'light' }}"
>
  <head>
    <script>
      if (document.documentElement.dataset.theme === 'automatic') {
        document.documentElement.dataset.theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
      }
    </script>
    <meta charset="UTF-8" />
    <title>Photos</title>
    <link rel="icon" type="image/svg+xml" href="/assets/photos/frontend/assets/photos-CMrLS0TC.svg" />
    <link rel="manifest" href="/assets/photos/frontend/pwa/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/assets/photos/frontend/pwa/apple-icon-180.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Photos" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta
      name="theme-color"
      content="{{ '#171717' if desk_theme and desk_theme.lower() == 'dark' else '#ffffff' }}"
    />
    <script type="module" crossorigin src="/assets/photos/frontend/assets/index-CMTc9ry1.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/photos/frontend/assets/index-Cw8cuYuN.css">
  </head>
  <body>
    <div id="app" class="h-screen"></div>
    <div id="modals"></div>
    <div id="popovers"></div>

    <script>
      window.csrf_token = '{{ csrf_token }}'
    </script>
  
          <script>
              {% for key in boot %}
              window["{{ key }}"] = {{ boot[key] | tojson }};
              {% endfor %}
          </script>
          </body>
          
</html>
